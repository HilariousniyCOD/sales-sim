<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SalesSim — Тренажёр продаж</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }
  #app {
    width: 100%;
    max-width: 480px;
    background: #16202a;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 800px;
  }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  .menu { padding: 30px 20px; text-align: center; justify-content: center; }
  .menu h1 { font-size: 32px; margin-bottom: 8px; background: linear-gradient(135deg, #1d9bf0, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .menu p { color: #71767b; margin-bottom: 30px; }
  .stats { background: #1c2732; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .stat-item { text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; color: #1d9bf0; }
  .stat-lbl { font-size: 11px; color: #71767b; text-transform: uppercase; }
  .btn {
    background: linear-gradient(135deg, #1d9bf0, #1a8cd8);
    color: white; border: none; padding: 14px 24px; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    width: 100%;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: #1c2732; color: #e7e9ea; }

  .briefing { padding: 25px 20px; }
  .briefing h2 { margin-bottom: 20px; font-size: 22px; }
  .brief-card {
    background: #1c2732; border-radius: 12px; padding: 15px; margin-bottom: 15px;
    border-left: 4px solid #1d9bf0;
  }
  .brief-card.warn { border-left-color: #f59e0b; }
  .brief-card strong { color: #1d9bf0; }
  .brief-card.warn strong { color: #f59e0b; }
  .brief-card .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .brief-card .row span:last-child { color: #e7e9ea; font-weight: 500; }
  .brief-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }

  .dialog { display: flex; flex-direction: column; height: 100%; }
  .header {
    background: #1c2732; padding: 12px 15px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #2f3336;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .client-info { flex: 1; }
  .client-name { font-weight: 600; font-size: 15px; }
  .client-role { font-size: 12px; color: #71767b; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 10px; }
  .bar-track { width: 80px; height: 6px; background: #0f1419; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 0.4s, background 0.4s; border-radius: 3px; }
  .bar.trust .bar-fill { background: linear-gradient(90deg, #10b981, #34d399); }
  .bar.interest .bar-fill { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .bar.resistance .bar-fill { background: linear-gradient(90deg, #ef4444, #f87171); }
  .bar-label { color: #71767b; width: 20px; text-align: right; }
  .bar-val { color: #e7e9ea; width: 24px; font-weight: 600; }

  .chat {
    flex: 1; overflow-y: auto; padding: 15px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.4; animation: pop 0.2s;
    word-wrap: break-word;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .msg.client { background: #1c2732; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.player {
    background: linear-gradient(135deg, #1d9bf0, #1a8cd8); color: white;
    align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .msg.system {
    align-self: center; background: transparent; color: #71767b;
    font-size: 12px; font-style: italic; text-align: center;
  }
  .msg .score-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border-radius: 8px; font-size: 10px; font-weight: 700;
  }
  .msg .score-tag.pos { background: #10b981; color: white; }
  .msg .score-tag.neg { background: #ef4444; color: white; }
  .msg .score-tag.neu { background: #71767b; color: white; }

  .input-area {
    padding: 10px; background: #1c2732; border-top: 1px solid #2f3336;
    display: flex; gap: 8px;
  }
  .input-area input {
    flex: 1; background: #0f1419; border: 1px solid #2f3336;
    color: #e7e9ea; padding: 10px 14px; border-radius: 20px;
    font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: #1d9bf0; }
  .input-area button {
    background: #1d9bf0; border: none; color: white;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  .result { padding: 30px 20px; text-align: center; justify-content: center; }
  .result-emoji { font-size: 64px; margin-bottom: 15px; }
  .result h2 { font-size: 26px; margin-bottom: 10px; }
  .result.win h2 { color: #10b981; }
  .result.lose h2 { color: #ef4444; }
  .result.partial h2 { color: #f59e0b; }
  .result-reason { color: #71767b; margin-bottom: 20px; font-size: 14px; white-space: pre-line; }
  .result-stats { background: #1c2732; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
  .result-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .result-row .val { font-weight: 600; color: #1d9bf0; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }

  .typing {
    align-self: flex-start; background: #1c2732; padding: 10px 14px;
    border-radius: 16px; border-bottom-left-radius: 4px;
    font-size: 14px; color: #71767b; font-style: italic;
  }
</style>
</head>
<body>
<div id="app">

  <div class="screen menu active" id="screen-menu">
    <h1>SalesSim</h1>
    <p>Тренажёр переговоров с ИИ</p>
    <div class="stats">
      <div class="stat-item"><div class="stat-val" id="st-money">0</div><div class="stat-lbl">💰 Заработано</div></div>
      <div class="stat-item"><div class="stat-val" id="st-deals">0</div><div class="stat-lbl">🤝 Сделок</div></div>
      <div class="stat-item"><div class="stat-val" id="st-rep">50</div><div class="stat-lbl">⭐ Репутация</div></div>
    </div>
    <button class="btn" onclick="startNewShift()">Начать смену</button>
  </div>

  <div class="screen briefing" id="screen-briefing">
    <h2>📋 Брифинг смены</h2>
    <div class="brief-card" id="brf-client"></div>
    <div class="brief-card warn" id="brf-task"></div>
    <div class="brief-actions">
      <button class="btn" onclick="startDialog()">Понял, начинаю</button>
      <button class="btn secondary" onclick="showScreen('menu')">Назад</button>
    </div>
  </div>

  <div class="screen dialog" id="screen-dialog">
    <div class="header">
      <div class="avatar" id="dlg-avatar">👤</div>
      <div class="client-info">
        <div class="client-name" id="dlg-name">—</div>
        <div class="client-role" id="dlg-role">—</div>
      </div>
      <div class="bars">
        <div class="bar trust"><span class="bar-label">T</span><div class="bar-track"><div class="bar-fill" id="bar-trust" style="width:20%"></div></div><span class="bar-val" id="val-trust">20</span></div>
        <div class="bar interest"><span class="bar-label">I</span><div class="bar-track"><div class="bar-fill" id="bar-interest" style="width:30%"></div></div><span class="bar-val" id="val-interest">30</span></div>
        <div class="bar resistance"><span class="bar-label">R</span><div class="bar-track"><div class="bar-fill" id="bar-resistance" style="width:80%"></div></div><span class="bar-val" id="val-resistance">80</span></div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Напишите ответ..." autocomplete="off">
      <button id="send-btn" onclick="sendReply()">➤</button>
    </div>
  </div>

  <div class="screen result" id="screen-result">
    <div class="result-emoji" id="res-emoji">🎉</div>
    <h2 id="res-title">—</h2>
    <p class="result-reason" id="res-reason">—</p>
    <div class="result-stats" id="res-stats"></div>
    <div class="result-actions">
      <button class="btn" onclick="startNewShift()">Следующий клиент</button>
      <button class="btn secondary" onclick="showScreen('menu')">В меню</button>
    </div>
  </div>

</div>

<script>
// ==================== НАСТРОЙКИ ====================
// ⚠️ ЗАМЕНИ НА СВОЙ URL WORKER'А
const WORKER_URL = "https://sales-sim-backend.aijr4444444444444444.workers.dev";

// ==================== ДАННЫЕ ====================

const SCENARIOS = [
  {
    avatar: '👨‍💻', name: 'Андрей', role: 'фрилансер-дизайнер',
    wants: 'ноутбук', wantsPrice: 1500,
    mustSell: 'ноутбук Pro X', mustSellPrice: 3500,
    commission: 0.10,
    context: 'Ноутбук для работы. Ему важно, чтобы не тормозил в графических редакторах.',
    cheapName: 'базовый ноут',
    expensiveName: 'ноутбук Pro X'
  },
  {
    avatar: '💇‍♀️', name: 'Ольга', role: 'владелица салона красоты',
    wants: 'кассовый аппарат', wantsPrice: 500,
    mustSell: 'SmartKassa Pro', mustSellPrice: 1500,
    commission: 0.12,
    context: 'Ей нужна касса для салона. Важно, чтобы работала с маркировкой и отправляла чеки.',
    cheapName: 'простая касса',
    expensiveName: 'SmartKassa Pro'
  },
  {
    avatar: '👨‍🔧', name: 'Дмитрий', role: 'сисадмин',
    wants: 'смартфон', wantsPrice: 800,
    mustSell: 'Galaxy Ultra', mustSellPrice: 1800,
    commission: 0.08,
    context: 'Телефон для работы и жизни. Много звонков, съёмок, видеоконференций.',
    cheapName: 'базовый смартфон',
    expensiveName: 'Galaxy Ultra'
  },
  {
    avatar: '👩', name: 'Марина', role: 'мама двоих детей',
    wants: 'детский велосипед', wantsPrice: 200,
    mustSell: 'Trail Kids Pro', mustSellPrice: 500,
    commission: 0.15,
    context: 'Велосипед для ребёнка 8 лет. Важно, чтобы был безопасный и прослужил несколько лет.',
    cheapName: 'простой велосипед',
    expensiveName: 'Trail Kids Pro'
  }
];

// ==================== СОСТОЯНИЕ ====================

let stats = JSON.parse(localStorage.getItem('salesim_stats') || '{"money":0,"deals":0,"rep":50}');
let game = null;

// ==================== УТИЛИТЫ ====================

function $(id){ return document.getElementById(id); }
function clamp(v, a=0, b=100){ return Math.max(a, Math.min(b, v)); }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function saveStats(){ localStorage.setItem('salesim_stats', JSON.stringify(stats)); }

// ==================== НАВИГАЦИЯ ====================

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-'+name).classList.add('active');
}

function updateStatsUI(){
  $('st-money').textContent = stats.money;
  $('st-deals').textContent = stats.deals;
  $('st-rep').textContent = stats.rep;
}

function updateBars(){
  const c = game.client;
  $('bar-trust').style.width = c.trust + '%';
  $('bar-interest').style.width = c.interest + '%';
  $('bar-resistance').style.width = c.resistance + '%';
  $('val-trust').textContent = Math.round(c.trust);
  $('val-interest').textContent = Math.round(c.interest);
  $('val-resistance').textContent = Math.round(c.resistance);
}

// ==================== ИГРОВОЙ ЦИКЛ ====================

function startNewShift(){
  const sc = rand(SCENARIOS);
  const interest = randInt(15, 60);
  game = {
    scenario: sc,
    client: {
      trust: 20,
      interest: interest,
      resistance: randInt(60, 85)
    },
    history: [],
    triedUpsell: false,
    turn: 0
  };

  $('brf-client').innerHTML = `
    <div style="font-size:32px;text-align:center;margin-bottom:8px">${sc.avatar}</div>
    <div class="row"><span>Клиент:</span><span>${sc.name}</span></div>
    <div class="row"><span>Кто:</span><span>${sc.role}</span></div>
    <div class="row"><span>Хочет купить:</span><span>${sc.wants} за ${sc.wantsPrice} BYN</span></div>
    <div class="row"><span>Настрой:</span><span>${interest > 45 ? '🔥 тёплый' : interest > 25 ? '🙂 нейтральный' : '🥶 холодный'}</span></div>
  `;
  $('brf-task').innerHTML = `
    <div style="font-weight:600;margin-bottom:8px">🎯 Ваша задача</div>
    <div class="row"><span>Продать:</span><span>${sc.mustSell}</span></div>
    <div class="row"><span>Цена:</span><span>${sc.mustSellPrice} BYN</span></div>
    <div class="row"><span>Ваша комиссия:</span><span>${Math.round(sc.commission*100)}% от суммы</span></div>
    <div style="margin-top:8px;font-size:12px;color:#71767b">💡 ${sc.context}</div>
  `;
  showScreen('briefing');
}

function startDialog(){
  $('dlg-avatar').textContent = game.scenario.avatar;
  $('dlg-name').textContent = game.scenario.name;
  $('dlg-role').textContent = game.scenario.role;
  $('chat').innerHTML = '';
  updateBars();
  showScreen('dialog');

  // Приветствие от ИИ
  sendToAI("Здравствуйте. Я только зашёл.");
  $('input').focus();
}

function addMessage(role, text, score=null){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role === 'player' && score !== null){
    const cls = score > 10 ? 'pos' : score < -10 ? 'neg' : 'neu';
    const sign = score > 0 ? '+' : '';
    div.innerHTML = escapeHtml(text) + `<span class="score-tag ${cls}">${sign}${score}</span>`;
  } else {
    div.textContent = text;
  }
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.textContent = 'печатает...';
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function removeTyping(){
  const el = $('typing-indicator');
  if(el) el.remove();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ==================== РАБОТА С ИИ ====================

async function sendToAI(userMessage){
  $('send-btn').disabled = true;
  $('input').disabled = true;
  addTyping();

  // Формируем историю для ИИ
  const historyForAI = game.history.map(h => ({
    role: h.role === 'player' ? 'user' : 'assistant',
    content: h.text
  }));

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userMessage,
        history: historyForAI,
        scenario: {
          name: game.scenario.name,
          role: game.scenario.role,
          wants: game.scenario.wants,
          wantsPrice: game.scenario.wantsPrice,
          mustSell: game.scenario.mustSell,
          mustSellPrice: game.scenario.mustSellPrice,
          trust: Math.round(game.client.trust),
          interest: Math.round(game.client.interest),
          resistance: Math.round(game.client.resistance)
        }
      })
    });

    removeTyping();

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      addMessage('system', 'Ошибка ИИ: ' + data.error);
      $('send-btn').disabled = false;
      $('input').disabled = false;
      return;
    }

    // Применяем изменения от ИИ
    const trustChange = data.trust_change || 0;
    const interestChange = data.interest_change || 0;
    const resistanceChange = data.resistance_change || 0;
    
    game.client.trust = clamp(game.client.trust + trustChange);
    game.client.interest = clamp(game.client.interest + interestChange);
    game.client.resistance = clamp(game.client.resistance + resistanceChange);
    
    const score = trustChange + interestChange - resistanceChange;
    game.history.push({ role: 'player', text: userMessage, score });
    game.turn++;

    updateBars();

    // Проверка условий конца игры
    if (game.client.trust <= 5 || game.client.resistance >= 95) {
      setTimeout(() => endGame('lose', data.reply || 'Клиент потерял доверие и ушёл.'), 500);
      return;
    }

    if (game.client.trust > 65 && game.client.interest > 70 && game.client.resistance < 30) {
      const triedUpsell = game.history.some(h => /рекоменд|предлага|посмотрите|эта модель|лучше взять|возьмите|оформ/i.test(h.text));
      if (triedUpsell) {
        const price = game.scenario.mustSellPrice;
        const comm = Math.round(price * game.scenario.commission);
        setTimeout(() => endGame('win', `${data.reply}\n\nКлиент купил ${game.scenario.expensiveName} за ${price} BYN.\nВаша комиссия: ${comm} BYN.`, price, comm), 500);
      } else {
        const price = game.scenario.wantsPrice;
        const comm = Math.round(price * game.scenario.commission * 0.3);
        setTimeout(() => endGame('partial', `${data.reply}\n\nКлиент купил ${game.scenario.cheapName} за ${price} BYN.\nВы не предложили целевой товар. Комиссия: ${comm} BYN.`, price, comm), 500);
      }
      return;
    }

    // Показываем ответ клиента
    setTimeout(() => {
      addMessage('client', data.reply);
      $('send-btn').disabled = false;
      $('input').disabled = false;
      $('input').focus();
    }, 400);

  } catch (e) {
    removeTyping();
    console.error(e);
    addMessage('system', 'Ошибка сети. Проверьте WORKER_URL.');
    $('send-btn').disabled = false;
    $('input').disabled = false;
  }
}

function sendReply(){
  const input = $('input');
  const text = input.value.trim();
  if (!text || !game) return;
  input.value = '';
  addMessage('player', text);
  sendToAI(text);
}

function endGame(type, reason, price=0, comm=0){
  stats.money += comm;
  stats.deals += 1;
  if(type === 'win') stats.rep = clamp(stats.rep + 5);
  else if(type === 'lose') stats.rep = clamp(stats.rep - 10);
  else if(type === 'partial') stats.rep = clamp(stats.rep - 2);
  saveStats();

  const r = $('screen-result');
  r.classList.remove('win','lose','partial');
  r.classList.add(type);
  if(type === 'win'){
    $('res-emoji').textContent = '🎉';
    $('res-title').textContent = 'Отличная сделка!';
  } else if(type === 'partial'){
    $('res-emoji').textContent = '😐';
    $('res-title').textContent = 'Сделка, но не ваша победа';
  } else {
    $('res-emoji').textContent = '💨';
    $('res-title').textContent = 'Клиент ушёл';
  }
  $('res-reason').textContent = reason;
  $('res-stats').innerHTML = `
    <div class="result-row"><span>Ходов в диалоге:</span><span class="val">${game.turn}</span></div>
    <div class="result-row"><span>Итоговое доверие:</span><span class="val">${Math.round(game.client.trust)}</span></div>
    <div class="result-row"><span>Итоговый интерес:</span><span class="val">${Math.round(game.client.interest)}</span></div>
    <div class="result-row"><span>Заработано:</span><span class="val">+${comm} BYN</span></div>
    <div class="result-row"><span>Репутация:</span><span class="val">${stats.rep}</span></div>
  `;
  showScreen('result');
}

// ==================== ИНИТ ====================

$('input').addEventListener('keydown', e => {
  if(e.key === 'Enter') sendReply();
});

updateStatsUI();
</script>
</body>
</html>
